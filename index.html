<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salvia Collection</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6b3a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#1d2a1f;--mu:#667066;--ac:#2f6b3a;--ac2:#fff;--bd:#d9d6c8;--dn:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a15;--card:#1f2721;--tx:#e8efe8;--mu:#97a397;--ac:#6fbf7d;--ac2:#10200f;--bd:#334036;--dn:#f2877f}}
:root[data-theme="dark"]{--bg:#141a15;--card:#1f2721;--tx:#e8efe8;--mu:#97a397;--ac:#6fbf7d;--ac2:#10200f;--bd:#334036;--dn:#f2877f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
.hide{display:none!important}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 12px 8px;z-index:5;border-bottom:1px solid var(--bd)}
header h1{font-size:15px;margin:0 0 6px;color:var(--mu);font-weight:600}
input,textarea,select,button{font:inherit;color:var(--tx)}
#q{width:100%;padding:12px 14px;font-size:18px;border:2px solid var(--ac);border-radius:12px;background:var(--card)}
main{padding:10px 12px 90px}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;margin-bottom:8px;cursor:pointer}
.th{width:64px;height:64px;border-radius:8px;background:var(--bd);flex:none;object-fit:cover}
.card b{display:block}.card span{color:var(--mu);font-size:14px}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:var(--ac2);font-size:32px;box-shadow:0 2px 8px #0005}
button.b{padding:10px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);margin:4px 4px 0 0}
button.p{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
button.d{color:var(--dn)}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 4px}
.f{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
textarea.f{min-height:90px}textarea.big{min-height:150px}
.row{display:flex;gap:8px}.row>div{flex:1}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 12px;z-index:5;border-bottom:1px solid var(--bd)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{position:relative;aspect-ratio:1;border:2px dashed var(--bd);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;background:var(--card);cursor:pointer;color:var(--mu)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile small{position:absolute;left:0;right:0;bottom:0;background:#000a;color:#fff;text-align:center;padding:2px;font-size:12px}
.tile.e small{background:none;color:var(--mu)}
.tile .pl{font-size:34px}
.x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:18px;line-height:1;z-index:2}
.hp{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px;margin-bottom:6px}
.hp img{width:70px;height:70px;object-fit:cover;border-radius:8px;cursor:pointer}
.hp input{flex:1}
h2{font-size:16px;margin:22px 0 6px}
#lb{position:fixed;inset:0;background:#000e;z-index:20;display:flex;align-items:center;justify-content:center}
#lb img{max-width:100%;max-height:100%}
textarea.sm{min-height:60px}.hc{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}.hp select.f{padding:8px}.vh{font-size:22px;font-weight:700;margin:6px 0 0}.vs{color:var(--mu);margin:0 0 8px}.vr{margin:14px 0}.vl{font-size:13px;font-weight:600;color:var(--mu)}.vv{white-space:pre-wrap}#vm{position:fixed;inset:0;background:#000a;z-index:15;overflow:auto;padding:16px}.vbox{background:var(--bg);border-radius:12px;padding:14px;max-width:520px;margin:0 auto}#vl .row{margin-bottom:6px}.tabs{display:flex;gap:6px;margin-top:8px}.tabs button{flex:1;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}.tabs .on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}#wm{position:fixed;inset:0;background:#000a;z-index:15;overflow:auto;padding:16px}.note{color:var(--mu);font-size:13px}
</style>
</head>
<body>
<div id="list">
  <header><h1>🌿 My Salvias <span id="cnt"></span></h1><input id="q" type="search" placeholder="Search name, variety, flower, notes…" autocomplete="off"><div class="tabs"><button id="t1" class="on">My plants</button><button id="t2">Wish list</button></div></header>
  <main>
    <div id="items"></div>
    <h2>Backup</h2>
    <p class="note">Your plants are stored only in this browser on this phone. Save a backup file now and then.</p>
    <button class="b" id="exp">Save backup</button>
    <button class="b" id="imp">Restore backup</button>
    <p class="note" id="msg"></p>
  </main>
  <button class="fab" id="add" aria-label="Add plant">+</button>
</div>

<div id="edit" class="hide">
  <div class="bar"><button class="b" id="back">← Back</button><button class="b p hide" id="editBtn">Edit</button><button class="b p hide" id="save">Save</button></div>
  <main id="viewer"></main>
  <main id="form" class="hide">
    <label>Name</label><input class="f" data-k="name">
    <label>Variety</label><select class="f" id="variety"></select>
    <button class="b" id="vedit">Edit variety list</button>
    <label>Flower</label><textarea class="f big" data-k="flower"></textarea>
    <label>Leaf</label><textarea class="f" data-k="leaf"></textarea>
    <label>Calyx</label><textarea class="f" data-k="calyx"></textarea>
    <label>Height</label><textarea class="f sm" data-k="height"></textarea>
    <label>Location</label><input class="f" data-k="location">
    <label>Bought from</label><input class="f" data-k="bought">
    <label>Notes</label><textarea class="f big" data-k="notes"></textarea>
    <h2>Photos</h2><div id="ph"></div>
    <div style="margin-top:28px"><button class="b d hide" id="del">Delete this plant</button></div>
  </main>
</div>
<div id="vm" class="hide"><div class="vbox"><h2 style="margin-top:0">Edit variety list</h2><p class="note">Change spelling or capitalisation, or remove a name. Plants using a renamed variety are updated automatically.</p><div id="vl"></div><button class="b" id="vadd">＋ Add</button><div style="margin-top:14px"><button class="b p" id="vsave">Done</button><button class="b" id="vcancel">Cancel</button></div></div></div>
<div id="wm" class="hide"><div class="vbox"><h2 style="margin-top:0">Wish list</h2><label>Name</label><input class="f" id="wn"><label>Notes</label><textarea class="f" id="wo"></textarea><div style="margin-top:14px"><button class="b p" id="wsave">Save</button><button class="b" id="wcancel">Cancel</button></div><div style="margin-top:14px"><button class="b" id="wgot">Got it – add to my plants</button><button class="b d" id="wdel">Delete</button></div></div></div>
<div id="lb" class="hide"><img alt=""></div>

<script>
const $=s=>document.querySelector(s);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const SLOTS=[['ff','Flower – front'],['fs','Flower – side'],['leaf','Leaf'],['wide','Whole plant']];
const FIELDS=['name','variety','flower','leaf','calyx','height','location','bought','notes'];
let db,plants=[],lists={varieties:['Salvia greggii','Salvia microphylla'],statuses:['Healthy','Very healthy','Struggling','Died']},cur=null,dirty=false,mode='view',isNew=false;
let wish=[],tab='plants',pendingWish=null,wcur=null;

function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('salvias',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('p'))d.createObjectStore('p',{keyPath:'id'});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(st,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(st,mode);const r=fn(t.objectStore(st));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
async function load(){
  plants=(await tx('p','readonly',s=>s.getAll()))||[];
  plants.forEach(p=>{if(!p.height&&p.habit)p.height=p.habit;if(!p.notes&&p.details)p.notes=p.details});
  plants.sort((a,b)=>(a.name||'').localeCompare(b.name||''));renderList()}
async function loadWish(){const w=await tx('meta','readonly',s=>s.get('wishlist'));if(w)wish=w.items||[]}
const saveWish=()=>{wish.sort((a,b)=>(a.name||'').localeCompare(b.name||''));return tx('meta','readwrite',s=>s.put({id:'wishlist',items:wish}))};
async function loadLists(){const m=await tx('meta','readonly',s=>s.get('lists'));if(m){lists.varieties=m.varieties||lists.varieties;lists.statuses=m.statuses||lists.statuses}}
const saveLists=()=>tx('meta','readwrite',s=>s.put({id:'lists',varieties:lists.varieties,statuses:lists.statuses}));
async function addNew(kind,label){const n=(prompt('New '+label+':')||'').trim();if(!n)return null;const ex=lists[kind].find(x=>x.toLowerCase()===n.toLowerCase());if(ex)return ex;lists[kind].push(n);try{await saveLists()}catch(e){}return n}

function thumb(p){return (p.photos&&(p.photos.ff||p.photos.wide||p.photos.fs||p.photos.leaf))||(p.extras&&p.extras[0])||(p.healthPics&&p.healthPics[0]&&p.healthPics[0].img)||''}
function renderList(){
  const q=$('#q').value.trim().toLowerCase(),words=q.split(/\s+/).filter(Boolean);
  const m=t=>words.every(w=>t.toLowerCase().includes(w));
  const txt=p=>FIELDS.map(k=>p[k]||'').concat((p.healthPics||[]).map(x=>x.status||'')).join(' ');
  const hit=plants.filter(p=>m(txt(p))),wh=wish.filter(w=>m((w.name||'')+' '+(w.note||'')));
  $('#cnt').textContent='('+(q&&tab==='plants'?hit.length+' of ':'')+plants.length+')';
  $('#t1').textContent='My plants ('+plants.length+')';$('#t2').textContent='Wish list ('+wish.length+')';
  const wcard=w=>`<div class="card" data-w="${w.id}"><div><b>${esc(w.name)||'(unnamed)'}</b><span>${esc((w.note||'').slice(0,80))}</span></div></div>`;
  if(tab==='wish'){$('#items').innerHTML=wh.length?wh.map(wcard).join(''):`<div class="empty">${wish.length?'No match on your wish list.':'Nothing on your wish list yet. Tap + to add one.'}</div>`;return}
  let h=hit.length?hit.map(p=>{const t=thumb(p);return `<div class="card" data-id="${p.id}">${t?`<img class="th" src="${t}">`:'<div class="th"></div>'}<div><b>${esc(p.name)||'(unnamed)'}</b><span>${esc(p.variety||'')}</span></div></div>`}).join(''):`<div class="empty">${plants.length?'No match – you probably don’t have this one yet.':'No plants yet. Tap + to add your first.'}</div>`;
  if(q&&wh.length)h+='<h2>On your wish list</h2>'+wh.map(wcard).join('');
  $('#items').innerHTML=h;
}
function setTab(t){tab=t;$('#t1').classList.toggle('on',t==='plants');$('#t2').classList.toggle('on',t==='wish');renderList()}
$('#t1').onclick=()=>setTab('plants');$('#t2').onclick=()=>setTab('wish');
function openWish(w){
  wcur=w||{id:'w'+Date.now(),name:'',note:'',isNew:true};
  $('#wn').value=wcur.name;$('#wo').value=wcur.note||'';
  $('#wdel').classList.toggle('hide',!w);$('#wgot').classList.toggle('hide',!w);
  $('#wm').classList.remove('hide');if(!w)$('#wn').focus();
}
$('#wcancel').onclick=()=>$('#wm').classList.add('hide');
$('#wsave').onclick=async()=>{
  const n=$('#wn').value.trim();if(!n){alert('Please enter a name.');return}
  wcur.name=n;wcur.note=$('#wo').value;if(wcur.isNew){delete wcur.isNew;wish.push(wcur)}
  try{await saveWish()}catch(e){alert('Could not save.')}
  $('#wm').classList.add('hide');renderList();
};
$('#wdel').onclick=async()=>{if(!confirm('Remove "'+wcur.name+'" from your wish list?'))return;wish=wish.filter(w=>w.id!==wcur.id);await saveWish();$('#wm').classList.add('hide');renderList()};
$('#wgot').onclick=()=>{
  const w=wcur;$('#wm').classList.add('hide');setTab('plants');openEdit(null);pendingWish=w.id;
  cur.name=w.name;cur.notes=w.note||'';$('[data-k=name]').value=cur.name;$('[data-k=notes]').value=cur.notes;dirty=true;
};

function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.8))};im.onerror=()=>rej(new Error('bad image'));im.src=u})}
async function photoDate(f){
  try{
    const v=new DataView(await f.slice(0,262144).arrayBuffer());
    if(v.getUint16(0)!==0xFFD8)throw 0;
    let o=2;
    while(o<v.byteLength-4){
      const m=v.getUint16(o),l=v.getUint16(o+2);
      if(m===0xFFDA)break;
      if(m===0xFFE1&&v.getUint32(o+4)===0x45786966){
        const t=o+10,le=v.getUint16(t)===0x4949,g16=p=>v.getUint16(p,le),g32=p=>v.getUint32(p,le);
        const find=(ifd,tag)=>{const n=g16(t+ifd);for(let i=0;i<n;i++){const e=t+ifd+2+i*12;if(g16(e)===tag)return g32(e+8)}return null};
        const i0=g32(t+4),ex=find(i0,0x8769);
        let off=ex!=null?find(ex,0x9003):null;
        if(off==null)off=find(i0,0x0132);
        if(off!=null){let s='';for(let i=0;i<7;i++)s+=String.fromCharCode(v.getUint8(t+off+i));const r=s.match(/^(\d{4}):(\d\d)/);if(r&&r[1]>'1990'&&+r[2]>=1&&+r[2]<=12)return r[1]+'-'+r[2]}
        break;
      }
      o+=2+l;
    }
  }catch(e){}
  if(f.lastModified){const d=new Date(f.lastModified);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
  return null;
}
function pick(cb){saveDraft();const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{if(!i.files[0])return;try{const f=i.files[0],dt=await photoDate(f);cb(await shrink(f),dt);dirty=true;renderPhotos()}catch(e){alert('Could not read that photo.')}};i.click()}

const optsHTML=(items,val,ph,add)=>{const all=!val||items.includes(val)?items:[...items,val];return `<option value="">${ph}</option>`+all.map(v=>`<option${v===val?' selected':''}>${esc(v)}</option>`).join('')+`<option value="__new">＋ ${add}…</option>`};
const monthOpts=m=>MONTHS.map((n,i)=>{const v=String(i+1).padStart(2,'0');return `<option value="${v}"${v===m?' selected':''}>${n}</option>`}).join('');
const yearOpts=y=>{const now=new Date().getFullYear(),a=[];for(let i=now+1;i>=2000;i--)a.push(i);if(!a.includes(+y))a.push(+y);return a.map(i=>`<option${i==y?' selected':''}>${i}</option>`).join('')};
const ym=x=>(x.date||today()).slice(0,7);
const renderVariety=()=>{$('#variety').innerHTML=optsHTML(lists.varieties,cur.variety||'','Choose variety…','Add new variety')};

function renderPhotos(){
  const ph=cur.photos;
  let h='<div class="grid">'+SLOTS.map(([k,l])=>ph[k]?`<div class="tile" data-a="view" data-g="${k}"><img src="${ph[k]}"><button class="x" data-a="rm" data-g="${k}">×</button></div>`:`<div class="tile e" data-a="add" data-g="${k}"><span class="pl">＋</span><small>${l}</small></div>`).join('')+'</div>';
  h+='<h2>More</h2><div class="grid">'+cur.extras.map((s,i)=>`<div class="tile" data-a="view" data-g="x" data-i="${i}"><img src="${s}"><button class="x" data-a="rm" data-g="x" data-i="${i}">×</button></div>`).join('')+'<div class="tile e" data-a="add" data-g="x"><span class="pl">＋</span><small>Add more</small></div></div>';
  h+='<h2>Dated photos</h2>'+cur.healthPics.map((x,i)=>({x,i})).sort((a,b)=>ym(b.x).localeCompare(ym(a.x))).map(({x,i})=>{const [y,m]=ym(x).split('-');return `<div class="hp"><img src="${x.img}" data-a="view" data-g="h" data-i="${i}"><div class="hc"><div class="row"><select class="f" data-hm="${i}">${monthOpts(m)}</select><select class="f" data-hy="${i}">${yearOpts(y)}</select></div><textarea class="f" data-hs="${i}" rows="3">${esc(x.status||'')}</textarea></div><button class="b d" data-a="rm" data-g="h" data-i="${i}">×</button></div>`}).join('')+'<button class="b" data-a="add" data-g="h">＋ Add dated photo</button>';
  $('#ph').innerHTML=h;
}
function getImg(g,i){return g==='x'?cur.extras[i]:g==='h'?cur.healthPics[i].img:cur.photos[g]}

$('#ph').addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,g=t.dataset.g,i=+t.dataset.i;
  if(a==='rm'){e.stopPropagation();if(!confirm('Remove this photo?'))return;if(g==='x')cur.extras.splice(i,1);else if(g==='h')cur.healthPics.splice(i,1);else delete cur.photos[g];dirty=true;renderPhotos()}
  else if(a==='view'){$('#lb img').src=getImg(g,i);$('#lb').classList.remove('hide')}
  else if(a==='add'){pick((d,dt)=>{if(g==='x')cur.extras.push(d);else if(g==='h')cur.healthPics.push({img:d,date:dt||today().slice(0,7),status:''});else cur.photos[g]=d})}
});
$('#ph').addEventListener('change',async e=>{
  const t=e.target,hp=t.closest('.hp');if(!hp)return;
  if(t.dataset.hm!==undefined||t.dataset.hy!==undefined){
    const i=+(t.dataset.hm??t.dataset.hy);cur.healthPics[i].date=hp.querySelector('[data-hy]').value+'-'+hp.querySelector('[data-hm]').value;dirty=true;renderPhotos()}
});
$('#ph').addEventListener('input',e=>{const t=e.target;if(t.dataset.hs!==undefined){cur.healthPics[+t.dataset.hs].status=t.value;dirty=true}});
$('#variety').onchange=async e=>{let v=e.target.value;if(v==='__new')v=(await addNew('varieties','variety'))||cur.variety||'';cur.variety=v;dirty=true;renderVariety()};
let vw=[];
function renderVL(){$('#vl').innerHTML=vw.map((x,i)=>`<div class="row"><input class="f" data-vi="${i}" value="${esc(x.n)}"><button class="b d" style="flex:none" data-vd="${i}">×</button></div>`).join('')}
$('#vedit').onclick=()=>{vw=lists.varieties.map(v=>({o:v,n:v}));renderVL();$('#vm').classList.remove('hide')};
$('#vl').addEventListener('input',e=>{if(e.target.dataset.vi!==undefined)vw[+e.target.dataset.vi].n=e.target.value});
$('#vl').addEventListener('click',e=>{const d=e.target.closest('[data-vd]');if(d){vw.splice(+d.dataset.vd,1);renderVL()}});
$('#vadd').onclick=()=>{vw.push({o:null,n:''});renderVL();const a=$('#vl').querySelectorAll('input');a[a.length-1].focus()};
$('#vcancel').onclick=()=>$('#vm').classList.add('hide');
$('#vsave').onclick=async()=>{
  const map=Object.create(null),out=[];
  vw.forEach(x=>{const n=x.n.trim();if(!n)return;const ex=out.find(y=>y.toLowerCase()===n.toLowerCase()),fin=ex||n;if(!ex)out.push(n);if(x.o!==null&&x.o!==fin)map[x.o]=fin});
  try{
    lists.varieties=out;await saveLists();
    for(const p of plants){if(p.variety&&map[p.variety]){p.variety=map[p.variety];await tx('p','readwrite',s=>s.put(p))}}
    if(cur&&cur.variety&&map[cur.variety])cur.variety=map[cur.variety];
    $('#vm').classList.add('hide');await load();renderVariety();renderViewer()}
  catch(e){alert('Could not save the list.')}
};
$('#lb').onclick=()=>$('#lb').classList.add('hide');

function show(v){$('#list').classList.toggle('hide',v!=='list');$('#edit').classList.toggle('hide',v!=='edit');window.scrollTo(0,0)}
function setMode(m){mode=m;$('#viewer').classList.toggle('hide',m!=='view');$('#form').classList.toggle('hide',m!=='edit');$('#editBtn').classList.toggle('hide',m!=='view');$('#save').classList.toggle('hide',m!=='edit');window.scrollTo(0,0)}
function renderViewer(){
  const p=cur,ph=p.photos||{};
  const row=(l,v)=>v?`<div class="vr"><div class="vl">${l}</div><div class="vv">${esc(v)}</div></div>`:'';
  const tiles=SLOTS.filter(([k])=>ph[k]).map(([k])=>`<div class="tile" data-a="view" data-g="${k}"><img src="${ph[k]}"></div>`).join('')+(p.extras||[]).map((x,i)=>`<div class="tile" data-a="view" data-g="x" data-i="${i}"><img src="${x}"></div>`).join('');
  const dated=(p.healthPics||[]).map((x,i)=>({x,i})).sort((a,b)=>ym(b.x).localeCompare(ym(a.x))).map(({x,i})=>{const [y,m]=ym(x).split('-');return `<div class="hp"><img src="${x.img}" data-a="view" data-g="h" data-i="${i}"><div class="hc"><b>${MONTHS[+m-1]} ${y}</b><div class="vv">${esc(x.status||'')}</div></div></div>`}).join('');
  $('#viewer').innerHTML=`<div class="vh">${esc(p.name)||'(unnamed)'}</div><div class="vs">${esc(p.variety||'')}</div>`+row('Flower',p.flower)+row('Leaf',p.leaf)+row('Calyx',p.calyx)+row('Height',p.height)+row('Location',p.location)+row('Bought from',p.bought)+row('Notes',p.notes)+(tiles?`<h2>Photos</h2><div class="grid">${tiles}</div>`:'')+(dated?`<h2>Dated photos</h2>${dated}`:'');
}
$('#viewer').addEventListener('click',e=>{const t=e.target.closest('[data-a="view"]');if(t){$('#lb img').src=getImg(t.dataset.g,+t.dataset.i);$('#lb').classList.remove('hide')}});
let lastJson='';
async function saveDraft(){
  if(mode!=='edit'||!dirty||!cur)return;
  try{const j=JSON.stringify(cur);if(j===lastJson)return;lastJson=j;await tx('meta','readwrite',s=>s.put({id:'draft',plant:cur,isNew,at:Date.now()}))}catch(e){lastJson=''}
}
const clearDraft=()=>{lastJson='';return tx('meta','readwrite',s=>s.delete('draft')).catch(()=>{})};
function openDraft(dr){
  cur=dr.plant;cur.photos=cur.photos||{};cur.extras=cur.extras||[];cur.healthPics=cur.healthPics||[];
  document.querySelectorAll('[data-k]').forEach(el=>el.value=cur[el.dataset.k]||'');
  isNew=!!dr.isNew;$('#del').classList.toggle('hide',isNew);dirty=true;lastJson='';
  renderVariety();renderPhotos();renderViewer();setMode('edit');show('edit');
}
setInterval(saveDraft,3000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveDraft()});
window.addEventListener('pagehide',saveDraft);
window.addEventListener('beforeunload',e=>{if(mode==='edit'&&dirty){saveDraft();e.preventDefault();e.returnValue=''}});
function openEdit(p){
  cur=p?JSON.parse(JSON.stringify(p)):{id:'p'+Date.now(),photos:{},extras:[],healthPics:[]};
  cur.photos=cur.photos||{};cur.extras=cur.extras||[];cur.healthPics=cur.healthPics||[];
  document.querySelectorAll('[data-k]').forEach(el=>el.value=cur[el.dataset.k]||'');
  $('#del').classList.toggle('hide',!p);dirty=false;isNew=!p;renderVariety();renderPhotos();renderViewer();setMode(p?'view':'edit');show('edit');
}
$('#edit').addEventListener('input',e=>{const k=e.target.dataset.k;if(k){cur[k]=e.target.value;dirty=true}});
$('#add').onclick=()=>{if(tab==='wish')openWish(null);else{pendingWish=null;openEdit(null)}};
$('#items').onclick=e=>{const c=e.target.closest('.card');if(!c)return;if(c.dataset.w)openWish(wish.find(w=>w.id===c.dataset.w));else openEdit(plants.find(p=>p.id===c.dataset.id))};
$('#back').onclick=()=>{
  if(mode==='edit'){
    if(dirty&&!confirm('Discard unsaved changes?'))return;
    clearDraft();
    if(isNew){pendingWish=null;show('list');return}
    openEdit(plants.find(p=>p.id===cur.id));return}
  show('list')};
$('#editBtn').onclick=()=>setMode('edit');
$('#save').onclick=async()=>{
  if(!(cur.name||'').trim()){alert('Please enter a name.');return}
  try{await tx('p','readwrite',s=>s.put(cur));dirty=false;await clearDraft();
    if(pendingWish){wish=wish.filter(w=>w.id!==pendingWish);pendingWish=null;await saveWish()}
    await load();openEdit(plants.find(p=>p.id===cur.id))}
  catch(e){alert('Could not save – phone storage may be full. Try saving a backup and removing some photos.')}
};
$('#del').onclick=async()=>{if(!confirm('Delete "'+cur.name+'" and all its photos?'))return;await tx('p','readwrite',s=>s.delete(cur.id));dirty=false;await clearDraft();await load();show('list')};
$('#q').addEventListener('input',renderList);

$('#exp').onclick=()=>{
  const m=$('#msg');
  try{const bl=new Blob([JSON.stringify({v:3,plants,lists,wish})],{type:'application/json'});const u=URL.createObjectURL(bl);
    const a=document.createElement('a');a.href=u;a.download='salvia-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),5000);m.textContent='Backup saved – check your Downloads folder.'}
  catch(e){m.textContent='Backup was not saved.'}
};
$('#imp').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{
  try{const o=JSON.parse(await i.files[0].text());const arr=o.plants||[];if(!Array.isArray(arr))throw 0;
    if(!confirm('Restore '+arr.length+' plants? Matching plants will be overwritten.'))return;
    for(const p of arr){if(p&&p.id)await tx('p','readwrite',s=>s.put(p))}
    if(o.lists){['varieties','statuses'].forEach(k=>(o.lists[k]||[]).forEach(v=>{if(!lists[k].includes(v))lists[k].push(v)}));await saveLists()}
    if(Array.isArray(o.wish)){o.wish.forEach(w=>{if(w&&w.id&&!wish.some(x=>x.id===w.id))wish.push(w)});await saveWish()}
    await load();$('#msg').textContent='Restored '+arr.length+' plants.'}
  catch(e){$('#msg').textContent='That doesn’t look like a valid backup file.'}};i.click()};

(async()=>{
  try{db=await openDB();await loadLists();await loadWish();await load();
    {const dr=await tx('meta','readonly',s=>s.get('draft')).catch(()=>null);if(dr&&dr.plant){if(confirm('You have unsaved changes to "'+(dr.plant.name||'a new plant')+'". OK to restore them, or Cancel to throw them away.'))openDraft(dr);else clearDraft()}}
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}
  catch(e){$('#items').innerHTML='<div class="empty">Storage is unavailable in this browser mode (private tabs block it). Open in a normal tab.</div>'}
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
